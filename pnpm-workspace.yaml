# pnpm workspace configuration
# https://pnpm.io/pnpm-workspace_yaml
packages:
  - '.'
  - 'packages/*'
  - 'docs'

# Dependencies that are explicitly allowed to run install/build scripts.
# pnpm 11+ blocks lifecycle scripts by default; list trusted packages here.
# An entry set to false is an explicit refusal rather than an omission: pnpm
# skips the script and the install still succeeds. Omitting a package that has
# one instead fails the install with ERR_PNPM_IGNORED_BUILDS, so every package
# with a build script needs a verdict here either way.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # jest-haste-map depends on this from jest 30.5 onwards. Its install script
  # only builds from source when no prebuilt binary matches, and the prebuilt
  # @parcel/watcher-<platform> packages cover every platform we run on, so the
  # module loads without it. Declined rather than trusted.
  '@parcel/watcher': false

# Wait three days after a version is published before installing it, so a
# freshly compromised release is not picked up on the day it lands. The value
# is in minutes. pnpm 11 already applies a one-day floor of its own, so this
# raises it to three to match Renovate. Renovate's floor only covers versions
# Renovate picks itself, and its weekly lockfile refresh hands resolution to
# pnpm, so this is the half that guards the regenerated lockfile.
minimumReleaseAge: 4320

# On, so the floor is never bypassed silently. When nothing in range is three
# days old, the install fails instead of taking the fresh version, and that
# holds for lock file maintenance as much as for a person. With strict off,
# pnpm would record the fallback in minimumReleaseAgeExclude, but Renovate
# commits only the lockfile, so on a Renovate PR nobody would ever see it. A
# --frozen-lockfile install never checks release age, so CI cannot catch it
# afterwards either.
#
# A version younger than the floor gets in only by being named, as an exact
# name@version (never a bare name, which exempts every future version), in a
# minimumReleaseAgeExclude list here. That is the manual approval for a same-day
# fix; the ERR_PNPM_NO_MATURE_MATCHING_VERSION error lists every version that
# needs it. Renovate writes the entry for the fixed package itself on every
# security PR, so only a fresh transitive dependency of the fix still needs one.
# Setting minimumReleaseAge turns strict on by default; it is written out so
# nobody turns it off thinking it is redundant.
minimumReleaseAgeStrict: true

# Override vulnerable transitive dependencies to patched versions.
overrides:
  multer: '>=2.2.0'
  postcss: '>=8.5.10'
