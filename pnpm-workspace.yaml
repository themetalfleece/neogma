# pnpm workspace configuration
# https://pnpm.io/pnpm-workspace_yaml
packages:
  - '.'
  - 'packages/*'
  - 'docs'

# Dependencies that are explicitly allowed to run install/build scripts.
# pnpm 11+ blocks lifecycle scripts by default; list trusted packages here.
# An entry set to false is an explicit refusal rather than an omission: pnpm
# skips the script and the install still succeeds. Omitting a package that has
# one instead fails the install with ERR_PNPM_IGNORED_BUILDS, so every package
# with a build script needs a verdict here either way.
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  # jest-haste-map depends on this from jest 30.5 onwards. Its install script
  # only builds from source when no prebuilt binary matches, and the prebuilt
  # @parcel/watcher-<platform> packages cover every platform we run on, so the
  # module loads without it. Declined rather than trusted.
  '@parcel/watcher': false

# Wait three days after a version is published before installing it, so a
# freshly compromised release is not picked up on the day it lands. The value
# is in minutes. pnpm 11 already applies a one-day floor of its own, so this
# raises it to three to match Renovate. Renovate's floor only covers versions
# Renovate picks itself, and its weekly lockfile refresh hands resolution to
# pnpm, so this is the half that guards the regenerated lockfile. Use
# minimumReleaseAgeExclude if a package ever needs to bypass it.
minimumReleaseAge: 4320

# Strict mode off narrows what the floor does, it does not weaken it. The floor
# is applied on every resolution either way: pnpm picks the newest version that
# clears it. Strict only governs the corner where nothing in range clears it at
# all, and there it aborts the install. That corner is the security path, where
# Renovate takes a patch published hours ago, so aborting would block the fix.
# With strict off pnpm uses the immature version and records it in a
# minimumReleaseAgeExclude list it adds to this file, so the fallback shows up
# in the diff instead of passing unnoticed. Configuring minimumReleaseAge at all
# turns strict on by default, so this line has to be explicit.
minimumReleaseAgeStrict: false

# Override vulnerable transitive dependencies to patched versions.
overrides:
  multer: '>=2.2.0'
  postcss: '>=8.5.10'
